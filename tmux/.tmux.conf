
# ---------------------------------------------------
# GENERAL SETTINGS
# ---------------------------------------------------
# Enable mouse support (allows resizing panes and selecting text)
set -g mouse on

# Neovim: ESC sin lag (escape-time bajo) y autoread funcional (focus-events).
# Recomendado por :checkhealth de Neovim.
set -sg escape-time 10
set -g focus-events on

# ---------------------------------------------------
# TERMINAL & IMAGE PASSTHROUGH (image.nvim / molten-nvim)
# ---------------------------------------------------
# Allow Kitty Graphics Protocol passthrough so image.nvim can render PNGs in
# ghostty while running inside tmux.
set -g allow-passthrough on
set -ga update-environment 'TERM TERM_PROGRAM'

# PATH del servidor tmux: Ghostty arranca tmux desde el .app con un PATH minimo
# (/usr/bin:/bin:/usr/sbin:/sbin:...) SIN /opt/homebrew/bin, asi que cualquier
# `run-shell` (hooks, tpm, tmux-tabicon, online-status, quarto-tile) fallaba con
# "tmux: command not found". Fijamos aqui un PATH completo para que todos los
# scripts encuentren tmux y demas binarios de Homebrew. Debe ir ANTES de `run tpm`.
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/Applications/Ghostty.app/Contents/MacOS"

# Truecolor support
# NOTA: usamos screen-256color (no tmux-256color) porque la UI dinamica de
# ngrok no entiende el terminfo tmux-256color y cae a un modo "solaris" sin
# interfaz. Con screen-256color, ngrok renderiza su dashboard correctamente.
# Los overrides de abajo recuperan truecolor, italics y undercurl para nvim.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ',*:Tc'                       # truecolor (24-bit)
set -as terminal-features ',*:RGB'                        # truecolor moderno (lo que detectan apps como Claude Code/Ink)
set -ga terminal-overrides ',*:sitm=\E[3m:ritm=\E[23m'   # italics
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'        # undercurl
set -as terminal-features ',*:strikethrough'              # tachado ~~texto~~ (ghostty lo soporta; ncurses de macOS no trae smxx)

# Extended keys: deja pasar Ctrl+Enter, Shift+Enter, etc. a las apps TUI
# (noodle usa Ctrl+Enter para enviar requests). Requiere terminal exterior
# con soporte de teclado extendido (ghostty lo tiene).
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # color del undercurl

# ---------------------------------------------------
# VIM-STYLE PANE NAVIGATION
# ---------------------------------------------------
# Use h, j, k, l to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------------------------------------------------
# WINDOW (TAB) PICKER — floating list
# ---------------------------------------------------
# prefix + b: abre un picker flotante (display-popup + fzf) con todas las
# ventanas de la sesion (indice, nombre y comando activo). Sin campo de busqueda:
# se navega con j/k y se salta con Enter. Asi no hay que acordarse del numero.
# `-E` cierra el popup al terminar; el borde usa el azul de la paleta onedark.
set -g popup-border-lines rounded
set -g popup-border-style "fg=#4fa6ed"
bind b display-popup -E -w 50% -h 45% \
  "~/.tmux/scripts/window-picker.sh '#{session_name}'"

# ---------------------------------------------------
# prefix + t: menu del timer de la barra (nuevo / pausar / reiniciar / cancelar).
# El "Nuevo" pide duracion (25m, 90s, 1h30m, o un numero suelto = minutos) y un
# nombre opcional. El prompt lo lanza el script para no anidar comillas aqui.
bind t display-menu -T "#[align=centre,fg=#{@thm_yellow}] 󰄉 Timer " -x C -y C \
  "Nuevo…"             n "run-shell '~/.tmux/scripts/timer.sh prompt'" \
  "Pausar / reanudar"  p "run-shell '~/.tmux/scripts/timer.sh pause'" \
  "Reiniciar"          r "run-shell '~/.tmux/scripts/timer.sh restart'" \
  ""                     \
  "Cancelar"           x "run-shell '~/.tmux/scripts/timer.sh stop'"

# ---------------------------------------------------
# PANE RESIZING
# ---------------------------------------------------
# Resize panes using PREFIX + H/J/K/L (Vim style)
# The '-r' flag allows you to hold the key to repeat
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------
# COPY MODE
# ---------------------------------------------------
# Use Vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Smoother mouse wheel scroll: 2 lines per tick instead of the default 5
bind-key -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

# ---------------------------------------------------
# ONEDARK DARKER THEME COLORS
# ---------------------------------------------------
# Base colors (onedark.nvim style=darker: github.com/navarasu/onedark.nvim)
set -g @thm_bg "#1f2329"
set -g @thm_fg "#dde1e7"
set -g @thm_overlay_0 "#535965"
set -g @thm_white "#dde1e7"

# Accents (onedark darker)
set -g @thm_red "#e55561"
set -g @thm_green "#8ebd6b"
set -g @thm_yellow "#e2b86b"
set -g @thm_blue "#4fa6ed"
set -g @thm_magenta "#bf68d9"
set -g @thm_cyan "#48b0bd"

# Logical mappings (onedark darker)
set -g @thm_peach "#cc9057"
set -g @thm_maroon "#e55561"
set -g @thm_mauve "#bf68d9"
set -g @thm_pink "#bf68d9"
set -g @thm_rosewater "#dde1e7"

# ---------------------------------------------------
# PLUGINS
# ---------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'mocaffy/tmux-tabicon'

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"


# ---------------------------------------------------
# STATUS BAR & VISUALS
# ---------------------------------------------------
# Configure Tmux Status Bar Positioning
set -g status-position top
# 1s en vez de los 15s por defecto: si no, la cuenta atras del timer
# avanzaria a saltos de 15 segundos.
set -g status-interval 1
set -g status-style "bg=default"
set -g status-justify "left"

# Pane Border Look and Feel
setw -g pane-border-status top
setw -g pane-border-format ""

# Active Pane: transparent border (fg=default) para que la linea superior no se
# pinte de naranja/amarillo. Igual que el borde inactivo -> linea "invisible".
setw -g pane-active-border-style "bg=default,fg=default"

# Inactive Pane: Set fg to default/bg to make lines 'transparent'
setw -g pane-border-style "bg=default,fg=default"

setw -g pane-border-lines heavy

# Window Look and Feel
# Nombre automatico de cada ventana (tab):
#   - nvim  -> nombre del archivo abierto (via #{pane_title}, que nvim fija con
#              titlestring=%t; ver nvim/.../core/options.lua).
#   - resto (copilot, shell, etc.) -> nombre del directorio actual
#     (#{b:pane_current_path} = basename del cwd del pane).
# El titulo del tab (tabicon) muestra "#I: #W", asi que #W = este nombre.
set -wg automatic-rename on
# allow-rename off: nvim/otros programas actualizan #{pane_title} (via OSC) pero
# NO renombran la ventana directamente. Asi automatic-rename-format sigue mandando
# y el nombre vuelve al directorio al salir de nvim (si estuviera 'on', el titulo
# de nvim fijaria el nombre y desactivaria el auto-rename de esa ventana).
set -wg allow-rename off
set -g automatic-rename-format "#{?#{==:#{pane_current_command},nvim},#{pane_title},#{b:pane_current_path}}"

# --- FIXED SECTION START ---
# We force specific colors inside the format strings.

# @claude_done: flag de notificacion "Claude terminó" puesto por el hook Stop
# (~/.claude/hooks/tmux-claude-done.sh). Muestra un icono de exclamación en la
# ventana de fondo donde Claude acabó; se borra solo al seleccionarla (ver el
# hook after-select-window más abajo).

# Inactive Window: Uses 'overlay_0' (Dark Grey) to appear dimmed
# (la coma de #[fg=...#,bold] va escapada con #, para no romper el #{?...})
# NOTA: window-status-format y window-status-current-format ahora los controla
# el plugin tmux-tabicon (ver seccion TAB ICONS mas abajo): reescribe cada tab
# por-ventana con un icono segun #{pane_current_command} y un color de la paleta.
# El indice (#I), el nombre condicional y el flag @claude_done se conservan alli
# via @tmux-tabicon-tab-title. Se dejan comentadas como referencia del look previo.
# set -g window-status-format "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}] #I#{?#{!=:#{window_name},Window},: #W,}#{?#{@claude_done}, #[fg=#{@thm_red}#,bold]  ,} "

# Active Window: Uses 'yellow' and bold to stand out
# set -g window-status-current-format "#[bg=#{@thm_bg},fg=#{@thm_yellow},bold] #I#{?#{!=:#{window_name},Window},: #W,}#{?#{@claude_done}, #[fg=#{@thm_red}#,bold]  ,} "

# Reset global styles to avoid conflicts
set -g window-status-style "bg=default,fg=default"
set -g window-status-current-style "bg=default,fg=default"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=default,fg=#{@thm_overlay_0}]│"
# --- FIXED SECTION END ---

# ---------------------------------------------------
# TAB ICONS (mocaffy/tmux-tabicon)
# ---------------------------------------------------
# El plugin reescribe window-status-format / -current-format por-ventana:
#   - ICONO segun el comando activo del pane (#{pane_current_command}).
#   - COLOR de la paleta 0x96f (#C se reemplaza por el color resuelto).
# Se re-renderiza con los hooks del plugin (session-created, after-new-window,
# pane-exited) y con prefix + r. El titulo conserva #I, el nombre (si != Window)
# y el flag de notificacion @claude_done (Claude terminó).

set -g @tmux-tabicon-preset "none"

set -g @tmux-tabicon-tab-title        "#I#{?#{!=:#{window_name},Window},: #W,}#{?#{@claude_done}, #[fg=#{@thm_red}#,bold]  ,}"
set -g @tmux-tabicon-tab-active-title "#I#{?#{!=:#{window_name},Window},: #W,}#{?#{@claude_done}, #[fg=#{@thm_red}#,bold]  ,}"

# Tabs inactivas planas; la ACTIVA lleva un bloque de fondo (pill) para que se
# distinga de un vistazo: bg overlay, titulo amarillo bold, icono con su color.
set -g @tmux-tabicon-style-tab              "#[bg=default]"
set -g @tmux-tabicon-style-tab-icon         "#[fg=#C]"
set -g @tmux-tabicon-style-tab-title        "#[fg=#{@thm_overlay_0}]"
set -g @tmux-tabicon-style-tab-active       "#[bg=#{@thm_overlay_0}]"
set -g @tmux-tabicon-style-tab-active-icon  "#[bg=#{@thm_overlay_0},fg=#C]"
set -g @tmux-tabicon-style-tab-active-title "#[bg=#{@thm_overlay_0},fg=#{@thm_yellow},bold]"

# Separadores (mismo `│` tenue de antes).
set -g @tmux-tabicon-tab-separator           ""
set -g @tmux-tabicon-tab-before-first        " "
set -g @tmux-tabicon-tab-before              "#[fg=#{@thm_overlay_0}]│"
set -g @tmux-tabicon-tab-after               " "
set -g @tmux-tabicon-tab-after-last          " "
set -g @tmux-tabicon-tab-active-before-first "#[bg=#{@thm_overlay_0}] "
set -g @tmux-tabicon-tab-active-before       "#[bg=default,fg=#{@thm_overlay_0}]│#[bg=#{@thm_overlay_0}] "
set -g @tmux-tabicon-tab-active-after        "#[bg=#{@thm_overlay_0}] #[bg=default]"
set -g @tmux-tabicon-tab-active-after-last   "#[bg=#{@thm_overlay_0}] #[bg=default]"

# Fallback para ventanas sin match. IMPORTANTE: el plugin CONCATENA el color/icono
# "auto" despues del "manual", asi que si dejamos auto activo, una ventana que hace
# match manual queda con un color doble e invalido (p.ej. #ff7e83#ffc739) que tmux
# rechaza y el icono pierde color. Por eso vaciamos el auto ("|" = 1 elemento vacio,
# no emite nada) y usamos una regla catch-all `#{==:1,1}` (siempre cierta) como
# ultima prioridad en las listas manuales para dar color/icono por defecto.
set -g @tmux-tabicon-auto-icons  "|"
set -g @tmux-tabicon-auto-colors "|"

# Iconos por comando/estado. Se evaluan de mayor a menor prioridad segun el
# orden del array (el ultimo gana): catch-all -> shells -> multipane -> apps.
# nvim=  node=󰎙  python=  uvicorn=󱓞  copilot=  shell=  multipane=  default=●
set -g @tmux-tabicon-manual-icons "?#{==:1,1},●|?#{m:*zsh,#{pane_current_command}},|?#{m:*fish,#{pane_current_command}},|?#{>:#{window_panes},1},|?#{==:#{pane_current_command},uvicorn},󱓞|?#{m:python*,#{pane_current_command}},|?#{==:#{pane_current_command},node},󰎙|?#{==:#{pane_current_command},copilot},|?#{==:#{pane_current_command},nvim},|?#{==:#{pane_current_command},claude},|?#{m:[0-9]*_[0-9]*_[0-9]*,#{pane_current_command}},"

# Colores por comando/estado (colores de marca aproximados): nvim/node=verde,
# python=azul, uvicorn=teal, copilot=morado, claude=naranja Anthropic, shell=blanco,
# multipane=oro, default=gris.
set -g @tmux-tabicon-manual-colors "?#{==:1,1},#535965|?#{m:*zsh,#{pane_current_command}},#a0a8b7|?#{m:*fish,#{pane_current_command}},#a0a8b7|?#{>:#{window_panes},1},#e2b86b|?#{==:#{pane_current_command},uvicorn},#48b0bd|?#{m:python*,#{pane_current_command}},#4fa6ed|?#{==:#{pane_current_command},node},#8ebd6b|?#{==:#{pane_current_command},copilot},#bf68d9|?#{==:#{pane_current_command},nvim},#8ebd6b|?#{==:#{pane_current_command},claude},#d77757|?#{m:[0-9]*_[0-9]*_[0-9]*,#{pane_current_command}},#d77757"

# Status Left Look and Feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[bg=default,fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=default,fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Status Right Look and Feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=default,fg=#{@thm_green}]  #S }}"
# Cuenta atras: no pinta nada mientras no haya un timer en marcha.
# Se arranca con prefix+t y se para con prefix+T.
set -ga status-right "#[bg=default]#(~/.tmux/scripts/timer.sh status)"
set -ga status-right "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-right "#[bg=default,fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# ---------------------------------------------------
# QUARTO SPLIT
# ---------------------------------------------------
# Al cambiar de tab, si el window activo está marcado con @quarto_tile, coloca
# Ghostty en la mitad izquierda (el visor WebKit del preview se coloca solo en
# la derecha); en cualquier otro tab restaura Ghostty a pantalla completa. Sale
# de inmediato si no hay sesión de split activa (@quarto_active), así que en uso
# normal no tiene coste. Lo activa el comando :QuartoSplit de nvim.
# after-select-window solo se dispara con :select-window. Al crear una tab nueva
# (new-window) tmux la activa pero NO corre select-window, así que sin enganchar
# también after-new-window el script no corría y Ghostty se quedaba a media
# pantalla con el preview visible a la derecha. Ambos hooks usan el mismo script.
set-hook -g after-select-window 'run-shell -b "~/.tmux/scripts/quarto-tile.sh"'
set-hook -g after-new-window 'run-shell -b "~/.tmux/scripts/quarto-tile.sh"'

# Al ver/seleccionar una ventana, borra su flag de notificación "Claude terminó"
# (-ga para añadir al hook anterior sin sobrescribirlo).
set-hook -ga after-select-window 'set-option -uw @claude_done'

# ---------------------------------------------------
# INITIALIZATION
# ---------------------------------------------------
# Bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ---------------------------------------------------
# TAB ICONS: hooks de re-render (despues de tpm a proposito)
# ---------------------------------------------------
# tmux-tabicon fija el color/icono por-ventana ejecutando su render.sh; el propio
# plugin instala sus hooks con `set-hook -g` (sobrescribe), lo que PISARIA el hook
# after-new-window de QuartoSplit. Por eso los reconstruimos aqui, DESPUES de
# `run tpm`, para que convivan quarto + tabicon y para garantizar el render aunque
# tabicon.tmux no llegue a cargarse. El icono/color se resuelve en vivo via
# #{pane_current_command}, asi que solo hace falta re-render cuando cambia la lista
# de ventanas (crear/cerrar), no en cada comando.
set-hook -g  after-new-window 'run-shell -b "~/.tmux/scripts/quarto-tile.sh"'
set-hook -ga after-new-window 'run-shell -b "~/.tmux/plugins/tmux-tabicon/scripts/render.sh"'
set-hook -g  session-created  'run-shell -b "~/.tmux/plugins/tmux-tabicon/scripts/render.sh"'
set-hook -g  window-linked    'run-shell -b "~/.tmux/plugins/tmux-tabicon/scripts/render.sh"'
set-hook -g  window-unlinked  'run-shell -b "~/.tmux/plugins/tmux-tabicon/scripts/render.sh"'

# prefix + r: recarga la config y repinta los tabs manualmente.
bind r source-file ~/.tmux.conf \; run-shell -b "~/.tmux/plugins/tmux-tabicon/scripts/render.sh" \; display-message "tmux.conf recargado"

# Render inicial de tmux-tabicon al (re)cargar la config, para que los tabs
# se pinten de inmediato sin esperar a un hook o a prefix + r.
if "test -x ~/.tmux/plugins/tmux-tabicon/scripts/render.sh" \
   "run-shell -b '~/.tmux/plugins/tmux-tabicon/scripts/render.sh'"
